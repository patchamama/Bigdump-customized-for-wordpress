Listen 8443
ServerName staging.invalid
<VirtualHost 127.0.0.1:8443>
    ServerName staging.invalid:8443
    DocumentRoot /data/site
    SSLEngine on
    SSLCertificateFile /run/tls/site.crt
    SSLCertificateKeyFile /run/tls/site.key
    ErrorLog /data/logs/apache-error.log
    CustomLog /dev/null common
    <Directory /data/site>
        AllowOverride All
        # mod_rewrite requires owner-matched links; unrestricted following stays off.
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        Require all granted
    </Directory>
    <FilesMatch "^(wp-config\.php|\.migrate_config|\.cms-owned\.php|\.user\.ini|php\.ini)$">
        Require all denied
    </FilesMatch>
</VirtualHost>
